name: Evidence Sync and Cross-Reference Validation

on:
  schedule:
    - cron: '0 2 1,15 * *'
  workflow_dispatch:

concurrency:
  group: evidence-sync
  cancel-in-progress: true

jobs:
  sync-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<'EOF'
          [gdrive]
          type = drive
          client_id = ${RCLONE_DRIVE_CLIENT_ID}
          client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}
          scope = drive
          token = ${RCLONE_DRIVE_TOKEN}
          EOF

      - name: Sync known evidence folders from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/02_Evidence_Core

          folders=(
            "0_1_Regulators_R_S_A"
            "0_1_Parliamentary_Oversight"
            "0_2_0_Council_Concilliation_Mediation_Arbitration"
            "0_8_Afrocentric_Lies"
            "0_8_Denyes_Reitz_Inc"
            "GEMS_Notification"
          )

          for folder in "${folders[@]}"; do
            echo "Syncing ${folder} from Google Drive"
            mkdir -p "public/02_Evidence_Core/${folder}"
            rclone copy "gdrive:${folder}" "public/02_Evidence_Core/${folder}" \
              --transfers 4 \
              --checkers 8 \
              --links \
              --metadata \
              --create-empty-src-dirs
          done

      - name: Rebuild evidence indexes
        run: |
          python3 reindex_evidence.py

      - name: Validate evidence cross-references
        run: |
          python3 validate_crossrefs.py

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
          git add .
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi

          git commit -m "sync: monthly evidence refresh"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
