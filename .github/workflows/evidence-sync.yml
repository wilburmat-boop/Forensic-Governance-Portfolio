name: Evidence Sync and Cross-Reference Validation
on:
  schedule:
    - cron: '0 2 1,15 * *'
  workflow_dispatch:

concurrency:
  group: evidence-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-evidence:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Sync evidence folders from Drive
        shell: bash
        run: |
          set -euo pipefail
          folders=(
            "0_1_Regulators_R_S_A"
            "0_1_Parliamentary_Oversight"
            "0_2_0_Council_Concilliation_Mediation_Arbitration"
            "0_8_Afrocentric_Lies"
            "0_8_Denyes_Reitz_Inc"
            "GEMS_Notification"
          )
          for folder in "${folders[@]}"; do
            mkdir -p "public/02_Evidence_Core/${folder}"
            rclone copy "gdrive:${folder}" "public/02_Evidence_Core/${folder}" \
              --transfers 4 --checkers 8 --links --metadata --create-empty-src-dirs
          done
      - name: Rebuild indexes
        run: python3 reindex_evidence.py
      - name: Validate cross-references
        run: python3 validate_crossrefs.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/02_Evidence_Core   # add your generated index files here too
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          if git diff --cached --name-only | awk 'length($0)>200' | grep -q .; then
            echo "Refusing to commit: staged path over 200 chars"; exit 1
          fi
          git commit -m "sync: monthly evidence refresh"
          git pull --rebase origin main
          git push origin HEAD:main
