<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents timeline | Forensic Governance Portfolio</title>
<style>
  :root {
    --navy: #0D1B2A;
    --charcoal: #2B2D42;
    --gold: #C9A84C;
    --red: #B01010;
    --paper: #F7F5EF;
    --rule: #D9D2BF;
    --muted: #5d6270;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--paper);
    color: var(--charcoal);
    line-height: 1.6;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 2rem 1.25rem 1.5rem;
    border-bottom: 4px solid var(--gold);
  }
  header h1 { margin: 0 0 .25rem; font-size: 1.6rem; font-weight: normal; }
  header p { margin: 0; color: #c8cfda; max-width: 60ch; }
  .tools {
    display: flex; flex-wrap: wrap; gap: .6rem;
    padding: 1rem 1.25rem;
    background: #fff; border-bottom: 1px solid var(--rule);
    position: sticky; top: 0; z-index: 5;
  }
  .tools input, .tools select {
    font: inherit; font-size: .95rem;
    padding: .5rem .7rem; border: 1px solid var(--rule); border-radius: 4px;
    background: #fff; color: var(--charcoal); min-width: 0;
  }
  .tools input { flex: 1 1 12rem; }
  .tools input:focus-visible, .tools select:focus-visible,
  a:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  main { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }

  .month { margin: 2rem 0 .5rem; font-size: 1.05rem; color: var(--navy); }
  .spine { position: relative; padding-left: 1.6rem; border-left: 2px solid var(--gold); margin-left: .4rem; }
  .entry { position: relative; padding: 0 0 1.6rem; }
  .entry::before {
    content: ""; position: absolute; left: calc(-1.6rem - 7px); top: .5rem;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--gold);
  }
  .entry.sealed::before { background: var(--gold); }
  .entry.unknown::before { border-style: dashed; border-color: var(--red); }
  .when { font-size: 1.35rem; color: var(--navy); line-height: 1.2; }
  .when small { display: block; font-size: .85rem; color: var(--muted); }
  .entry h2 { margin: .3rem 0 .2rem; font-size: 1.1rem; }
  .entry h2 a { color: var(--navy); text-decoration-color: var(--gold); text-underline-offset: 3px; }
  .meta { font-size: .88rem; color: var(--muted); margin: 0 0 .4rem; }
  .meta span + span { margin-left: .9rem; }
  .tag { color: var(--red); }
  .summary { margin: 0 0 .5rem; max-width: 68ch; }
  .seal { font-family: "Courier New", monospace; font-size: .78rem; color: var(--muted); word-break: break-all; }
  details { margin-top: .4rem; }
  summary { cursor: pointer; color: var(--red); font-size: .92rem; }
  details ul { margin: .4rem 0 0 1.1rem; padding: 0; font-size: .92rem; }
  details li { margin-bottom: .3rem; }
  .empty { padding: 2rem 0; color: var(--muted); }
  @media (max-width: 520px) { .meta span { display: block; margin: 0; } .meta span + span { margin: 0; } }
</style>
</head>
<body>
<header>
  <h1>Documents timeline</h1>
  <p>Standalone documents in date order. Each entry links to the original file as supplied.</p>
</header>

<div class="tools">
  <input id="q" type="search" placeholder="Search titles, summaries, case numbers" aria-label="Search documents">
  <select id="type" aria-label="Filter by type"><option value="">All types</option></select>
  <select id="case" aria-label="Filter by case"><option value="">All cases</option></select>
</div>

<main>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<script>
(function () {
  var TYPE_LABEL = {
    filing: "Court filing (draft)",
    analysis: "Analysis",
    transcript: "Chat transcript"
  };
  var docs = [];
  var q = document.getElementById("q");
  var typeSel = document.getElementById("type");
  var caseSel = document.getElementById("case");
  var list = document.getElementById("list");
  var count = document.getElementById("count");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function monthKey(d) {
    if (!d.sort) return "Date to confirm";
    var dt = new Date(d.sort + "T00:00:00");
    return dt.toLocaleDateString("en-ZA", { month: "long", year: "numeric" });
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var t = typeSel.value, c = caseSel.value;
    var shown = docs.filter(function (d) {
      if (t && d.type !== t) return false;
      if (c && (d.cases || []).indexOf(c) === -1) return false;
      if (!term) return true;
      var hay = [d.title, d.summary, d.dateLabel, (d.cases || []).join(" ")].join(" ").toLowerCase();
      return hay.indexOf(term) !== -1;
    });

    list.textContent = "";
    count.textContent = shown.length + " of " + docs.length + " documents";
    if (!shown.length) { list.appendChild(el("p", "empty", "No documents match. Clear the search or filters.")); return; }

    var current = null, spine = null;
    shown.forEach(function (d) {
      var m = monthKey(d);
      if (m !== current) {
        current = m;
        list.appendChild(el("h3", "month", m));
        spine = el("div", "spine");
        list.appendChild(spine);
      }
      var e = el("article", "entry" + (d.sha256 ? " sealed" : "") + (d.dateConfidence === "unknown" ? " unknown" : ""));

      var when = el("div", "when", d.dateLabel || "");
      if (d.dateConfidence && d.dateConfidence !== "exact") {
        when.appendChild(el("small", null, d.dateConfidence === "unknown" ? "Date not in the file" : "Approximate date: confirm against the original"));
      }
      e.appendChild(when);

      var h = el("h2");
      var a = el("a", null, d.title);
      a.href = d.file; a.target = "_blank"; a.rel = "noopener";
      h.appendChild(a);
      e.appendChild(h);

      var meta = el("p", "meta");
      meta.appendChild(el("span", null, TYPE_LABEL[d.type] || d.type));
      meta.appendChild(el("span", null, (d.cases || []).join(", ")));
      if (d.duplicateOf) meta.appendChild(el("span", "tag", "Duplicate of " + d.duplicateOf));
      if (d.visibility === "review") meta.appendChild(el("span", "tag", "Review before publishing"));
      e.appendChild(meta);

      if (d.summary) e.appendChild(el("p", "summary", d.summary));
      e.appendChild(el("div", "seal", d.sha256 ? "SHA-256 " + d.sha256 : "Hash pending: run build_manifest.py"));

      if (d.notes && d.notes.length) {
        var det = el("details");
        det.appendChild(el("summary", null, "Points to check (" + d.notes.length + ")"));
        var ul = el("ul");
        d.notes.forEach(function (n) { ul.appendChild(el("li", null, n)); });
        det.appendChild(ul);
        e.appendChild(det);
      }
      spine.appendChild(e);
    });
  }

  function fill(sel, values, labelFn) {
    values.forEach(function (v) {
      var o = el("option", null, labelFn ? labelFn(v) : v);
      o.value = v; sel.appendChild(o);
    });
  }

  fetch("documents.json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      docs = (data.documents || []).slice().sort(function (a, b) {
        if (!a.sort && !b.sort) return 0;
        if (!a.sort) return 1;
        if (!b.sort) return -1;
        return a.sort < b.sort ? -1 : a.sort > b.sort ? 1 : 0;
      });
      var types = [], cases = [];
      docs.forEach(function (d) {
        if (types.indexOf(d.type) === -1) types.push(d.type);
        (d.cases || []).forEach(function (c) { if (cases.indexOf(c) === -1) cases.push(c); });
      });
      fill(typeSel, types, function (v) { return TYPE_LABEL[v] || v; });
      fill(caseSel, cases.sort());
      render();
    })
    .catch(function () {
      list.appendChild(el("p", "empty", "Could not load documents.json. Check it sits next to this page in /public."));
    });

  q.addEventListener("input", render);
  typeSel.addEventListener("change", render);
  caseSel.addEventListener("change", render);
})();
</script>
</body>
</html>
